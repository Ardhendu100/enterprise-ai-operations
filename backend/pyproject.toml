[project]
name = "enterprise-ai-operations-backend"
version = "0.1.0"
description = "Backend API for the Enterprise AI Operations Assistant"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ardhendu", email = "ardhendu.s@auroinfo.com" }
]

dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.1",
    "celery>=5.6.3",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------
# Ruff Configuration
# --------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# --------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

# --------------------------------------------------------------------
# MyPy
# --------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true

[tool.uv.build-backend]
module-name = "app"
module-root = "."